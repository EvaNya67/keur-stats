name: Mise à jour des stats

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures
  workflow_dispatch:       # bouton "Run workflow" pour actualiser à la main

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les stats Riot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node scripts/update.mjs
      - name: Enregistrer les changements
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mise à jour des stats"
          git push
